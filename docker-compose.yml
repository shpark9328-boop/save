services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ktx_alert
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: npx prisma migrate deploy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ktx_alert?schema=public
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    command: npm run start
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ktx_alert?schema=public
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: npm run worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ktx_alert?schema=public
      WORKER_ID: worker-1
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
